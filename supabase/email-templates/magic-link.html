<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu acesso ao Bolão Copa 2026</title>
</head>
<body style="margin:0; padding:0; background-color:#111B21; font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#111B21; padding:30px 15px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:480px; background-color:#202C33; border-radius:20px; overflow:hidden; border:1px solid #2A3942;">

          <!-- Header -->
          <tr>
            <td style="background: linear-gradient(135deg, #075E54, #00A884); padding:28px 24px; text-align:center;">
              <div style="font-size:40px; margin-bottom:6px;">🔐⚽</div>
              <h1 style="color:#FFFFFF; font-size:20px; font-weight:800; margin:0;">
                Bolão Copa 2026
              </h1>
            </td>
          </tr>

          <!-- Conteúdo -->
          <tr>
            <td style="padding:28px 24px;">
              <h2 style="color:#E9EDEF; font-size:18px; font-weight:700; margin:0 0 12px;">
                Seu link de acesso 🎯
              </h2>
              <p style="color:#8696A0; font-size:14px; line-height:1.6; margin:0 0 24px;">
                Clique no botão abaixo para entrar no seu bolão. O link é válido por <strong style="color:#E9EDEF;">1 hora</strong>.
              </p>

              <div style="text-align:center; margin:0 0 24px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block; background:linear-gradient(135deg,#00A884,#075E54); color:#FFFFFF;
                          text-decoration:none; padding:16px 48px; border-radius:14px; font-size:16px;
                          font-weight:700; letter-spacing:0.3px;">
                  Entrar no Bolão
                </a>
              </div>

              <p style="color:#3B4A54; font-size:11px; line-height:1.5; margin:0; text-align:center;">
                Se você não solicitou este acesso, ignore este e-mail.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:0 24px 24px; text-align:center;">
              <div style="border-top:1px solid #2A3942; padding-top:16px;">
                <p style="color:#3B4A54; font-size:10px; margin:0;">
                  bolao-bay.vercel.app
                </p>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
