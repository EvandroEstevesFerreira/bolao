<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Crown -->
  <g transform="translate(256, 130)">
    <path d="M-95 60 L-95 0 L-55 35 L0 -20 L55 35 L95 0 L95 60Z" fill="url(#gold)" stroke="url(#goldDark)" stroke-width="3"/>
    <path d="M-95 60 L95 60 L95 75 C95 80 90 85 85 85 L-85 85 C-90 85 -95 80 -95 75Z" fill="url(#goldDark)"/>
    <!-- Crown jewels -->
    <circle cx="0" cy="30" r="8" fill="#EF4444"/>
    <circle cx="-55" cy="42" r="6" fill="#06B6D4"/>
    <circle cx="55" cy="42" r="6" fill="#06B6D4"/>
    <!-- Crown points sparkle -->
    <circle cx="0" cy="-20" r="5" fill="#FEF3C7"/>
    <circle cx="-55" cy="35" r="4" fill="#FEF3C7"/>
    <circle cx="55" cy="35" r="4" fill="#FEF3C7"/>
  </g>
  <!-- Soccer ball -->
  <g transform="translate(256, 330)">
    <circle cx="0" cy="0" r="110" fill="white"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="3"/>
    <!-- Center pentagon -->
    <polygon points="0,-42 -25,-14 -15,32 15,32 25,-14" fill="#2d2d2d"/>
    <!-- Top pentagon -->
    <polygon points="0,-110 -24,-82 -8,-42 8,-42 24,-82" fill="#2d2d2d"/>
    <!-- Top-left pentagon -->
    <polygon points="-105,-34 -88,-6 -56,-14 -48,-42 -72,-66" fill="#2d2d2d"/>
    <!-- Top-right pentagon -->
    <polygon points="105,-34 88,-6 56,-14 48,-42 72,-66" fill="#2d2d2d"/>
    <!-- Bottom-left pentagon -->
    <polygon points="-64,88 -36,82 -15,52 -30,24 -58,30" fill="#2d2d2d"/>
    <!-- Bottom-right pentagon -->
    <polygon points="64,88 36,82 15,52 30,24 58,30" fill="#2d2d2d"/>
    <!-- Subtle shine -->
    <ellipse cx="-30" cy="-40" rx="20" ry="30" fill="rgba(255,255,255,0.15)" transform="rotate(-20)"/>
  </g>
</svg>
