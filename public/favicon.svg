  <path d="M190 92 h-16 c-6 0-12 4-12 10 v34 c0 26 14 46 28 54 v-10 c-10-8-18-22-18-44 v-34 h18Z" fill="url(#goldDark)"/>
  <path d="M322 92 h16 c6 0 12 4 12 10 v34 c0 26-14 46-28 54 v-10 c10-8 18-22 18-44 v-34 h-18Z" fill="url(#goldDark)"/>
  <!-- Trophy base plate -->
  <rect x="208" y="287" width="96" height="12" rx="4" fill="url(#goldDark)"/>
  <!-- Trophy shine -->
  <path d="M218 100 h14 v65 c0 8-3 14-7 18 h-3 c-3-4-4-10-4-18Z" fill="rgba(255,255,255,0.25)"/>
  <!-- Soccer ball - centered, touching trophy base -->
  <g transform="translate(256, 380)">
    <circle cx="0" cy="0" r="62" fill="white"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
    <!-- Center pentagon -->
    <polygon points="0,-24 -13,-8 -8,18 8,18 13,-8" fill="#2d2d2d"/>
    <!-- Top pentagon -->
    <polygon points="0,-62 -13,-44 -5,-24 5,-24 13,-44" fill="#2d2d2d"/>
    <!-- Top-left pentagon -->
    <polygon points="-59,-19 -49,-4 -31,-8 -27,-24 -40,-39" fill="#2d2d2d"/>
    <!-- Top-right pentagon -->
    <polygon points="59,-19 49,-4 31,-8 27,-24 40,-39" fill="#2d2d2d"/>
    <!-- Bottom-left pentagon -->
    <polygon points="-36,50 -20,46 -8,29 -18,13 -36,18" fill="#2d2d2d"/>
    <!-- Bottom-right pentagon -->
    <polygon points="36,50 20,46 8,29 18,13 36,18" fill="#2d2d2d"/>
  </g>
</svg>
